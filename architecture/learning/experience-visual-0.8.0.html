el=&quot;Explicação detalhada&quot;>&lt;div class=&quot;session-detail-head&quot;>&lt;h2>for: um item de cada vez&lt;/h2>&lt;button type=&quot;button&quot; data-session-close=&quot;&quot;>Fechar&lt;/button>&lt;/div>&lt;div class=&quot;session-detail-body&quot;>&lt;div class=&quot;session-detail-core&quot;>&lt;b>Ideia central&lt;/b>&lt;p>A leitura segura é: 'para cada item do iterável, execute o bloco'.&lt;/p>&lt;/div>&lt;h3>Intuição&lt;/h3>&lt;p>Imagine uma esteira que entrega um objeto por vez. A variável do laço é a etiqueta temporária do objeto que acabou de chegar.&lt;/p>&lt;div class=&quot;session-detail-why&quot;>&lt;b>Por que isso funciona&lt;/b>&lt;p>O for pede um iterável, cria internamente o percurso e interrompe quando os itens acabam; você não precisa atualizar manualmente uma posição para fazê-lo avançar.&lt;/p>&lt;/div>&lt;h3>Outra forma de enxergar&lt;/h3>&lt;div class=&quot;session-visuals&quot;>&lt;div class=&quot;session-visual&quot;>&lt;h3>Segunda representação — variável temporária&lt;/h3>&lt;table class=&quot;sv-table&quot;>&lt;thead>&lt;tr>&lt;th>Iteração&lt;/th>&lt;th>Próximo item&lt;/th>&lt;th>Valor de nome&lt;/th>&lt;th>Ação&lt;/th>&lt;/tr>&lt;/thead>&lt;tbody>&lt;tr>&lt;td>1&lt;/td>&lt;td>'Lia'&lt;/td>&lt;td>'Lia'&lt;/td>&lt;td>imprime Lia&lt;/td>&lt;/tr>&lt;tr>&lt;td>2&lt;/td>&lt;td>'Rui'&lt;/td>&lt;td>'Rui'&lt;/td>&lt;td>imprime Rui&lt;/td>&lt;/tr>&lt;tr>&lt;td>fim&lt;/td>&lt;td>nenhum&lt;/td>&lt;td>permanece 'Rui'&lt;/td>&lt;td>segue após o laço&lt;/td>&lt;/tr>&lt;/tbody>&lt;/table>&lt;div class=&quot;caption&quot;>O nome da variável não é o item; ele recebe temporariamente cada item.&lt;/div>&lt;/div>&lt;/div>&lt;h3>Como reconhecer na questão&lt;/h3>&lt;p>Localize a variável entre for e in, identifique o iterável depois de in e marque quais linhas pertencem ao bloco pela indentação.&lt;/p>&lt;ol>&lt;li>escreva os itens do iterável na ordem&lt;/li>&lt;li>atribua o primeiro item à variável do laço&lt;/li>&lt;li>execute somente as linhas indentadas&lt;/li>&lt;li>repita com o próximo item até o iterável acabar&lt;/li>&lt;/ol>&lt;div class=&quot;session-detail-example&quot;>&lt;b>Exemplo guiado&lt;/b>&lt;p>Em nomes=['Lia','Rui'], o código for nome in nomes: print(nome) primeiro usa 'Lia' e depois 'Rui', imprimindo Lia e Rui.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-contrast&quot;>&lt;b>Compare com o erro comum&lt;/b>&lt;p>No teste 'Lia' in nomes, o resultado é True ou False. No laço for nome in nomes, nome recebe cada elemento e o bloco pode agir sobre ele.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-trap&quot;>&lt;b>Pegadinha típica&lt;/b>&lt;p>for não significa automaticamente 'contar números'. Ele pode percorrer strings, listas, tuplas, dicionários e outros iteráveis.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-link&quot;>&lt;b>Conexão útil&lt;/b>&lt;p>Você já usou in para testar pertencimento. Em for, a expressão após in fornece os itens que serão visitados, um por vez.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-check&quot;>&lt;b>Confira seu raciocínio&lt;/b>&lt;ul>&lt;li>Qual é o iterável?&lt;/li>&lt;li>Qual valor a variável recebe agora?&lt;/li>&lt;li>Quais linhas estão dentro do laço?&lt;/li>&lt;li>O bloco altera alguma variável externa?&lt;/li>&lt;/ul>&lt;/div>&lt;h3>Microchecagem mental&lt;/h3>&lt;p>Em for cor in ('azul','verde'), a variável cor recebe 'azul' e depois 'verde'.&lt;/p>&lt;section class=&quot;support-practice&quot;>&lt;h3>Vamos reconstruir em passos curtos&lt;/h3>&lt;p class=&quot;small&quot;>Estas microperguntas são apoio de aprendizagem e não alteram seu resultado formal.&lt;/p>&lt;div class=&quot;support-practice-item&quot;>&lt;p>&lt;b>Em for cidade in ['Recife','Natal'], qual valor cidade recebe na segunda iteração?&lt;/b>&lt;/p>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;0&quot; data-option-id=&quot;first_item&quot;>A. 'Recife'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;1&quot; data-option-id=&quot;second_item&quot;>B. 'Natal'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;2&quot; data-option-id=&quot;whole_iterable&quot;>C. ['Recife','Natal']&lt;/button>&lt;/div>&lt;div class=&quot;support-practice-item&quot;>&lt;p>&lt;b>Qual é o valor final de texto?

# V&lt;/pre>&lt;details class=&quot;info connection concept-disclosure&quot;>&lt;summary>Conexão com o que você já estudou&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>Você já usou in para testar pertencimento. Em for, a expressão após in fornece os itens que serão visitados, um por vez.&lt;/div>&lt;/details>&lt;details class=&quot;info trap concept-disclosure&quot;>&lt;summary>Pegadinha e erro comum&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>for não significa automaticamente 'contar números'. Ele pode percorrer strings, listas, tuplas, dicionários e outros iteráveis. Ler a variável do laço como se ela guardasse a coleção inteira, ou ignorar que ela recebe um novo valor antes de cada execução do bloco.&lt;/div>&lt;/details>&lt;div class=&quot;session-visuals&quot;>&lt;div class=&quot;session-visual&quot;>&lt;h3>Rastreamento do laço sobre a string FGV&lt;/h3>&lt;div class=&quot;sv-flow&quot;>&lt;div class=&quot;sv-step&quot;>letra recebe 'F' e imprime F&lt;/div>&lt;div class=&quot;sv-arrow&quot;>→&lt;/div>&lt;div class=&quot;sv-step&quot;>letra recebe 'G' e imprime G&lt;/div>&lt;div class=&quot;sv-arrow&quot;>→&lt;/div>&lt;div class=&quot;sv-step&quot;>letra recebe 'V' e imprime V&lt;/div>&lt;div class=&quot;sv-arrow&quot;>→&lt;/div>&lt;div class=&quot;sv-step&quot;>iterável termina; o laço termina&lt;/div>&lt;/div>&lt;div class=&quot;caption&quot;>A variável letra muda a cada iteração; o corpo executa uma vez para cada caractere.&lt;/div>&lt;/div>&lt;/div>&lt;section class=&quot;adaptive session-help&quot;>&lt;button id=&quot;adaptiveToggle&quot; aria-expanded=&quot;true&quot;>Não entendi / ver explicação completa&lt;/button>&lt;p class=&quot;session-help-note&quot;>Abra quando precisar. Aqui você encontra raciocínio adicional, exemplo e checklist; o uso é registrado como apoio, não como erro.&lt;/p>&lt;div class=&quot;session-detail-overlay&quot;>&lt;section class=&quot;session-detail-dialog&quot; role=&quot;region&quot; aria-label=&quot;Explicação detalhada&quot;>&lt;div class=&quot;session-detail-head&quot;>&lt;h2>for: um item de cada vez&lt;/h2>&lt;button type=&quot;button&quot; data-session-close=&quot;&quot;>Fechar&lt;/button>&lt;/div>&lt;div class=&quot;session-detail-body&quot;>&lt;div class=&quot;session-detail-core&quot;>&lt;b>Ideia central&lt;/b>&lt;p>A leitura segura é: 'para cada item do iterável, execute o bloco'.&lt;/p>&lt;/div>&lt;h3>Intuição&lt;/h3>&lt;p>Imagine uma esteira que entrega um objeto por vez. A variável do laço é a etiqueta temporária do objeto que acabou de chegar.&lt;/p>&lt;div class=&quot;session-detail-why&quot;>&lt;b>Por que isso funciona&lt;/b>&lt;p>O for pede um iterável, cria internamente o percurso e interrompe quando os itens acabam; você não precisa atualizar manualmente uma posição para fazê-lo avançar.&lt;/p>&lt;/div>&lt;h3>Outra forma de enxergar&lt;/h3>&lt;div class=&quot;session-visuals&quot;>&lt;div class=&quot;session-visual&quot;>&lt;h3>Segunda representação — variável temporária&lt;/h3>&lt;table class=&quot;sv-table&quot;>&lt;thead>&lt;tr>&lt;th>Iteração&lt;/th>&lt;th>Próximo item&lt;/th>&lt;th>Valor de nome&lt;/th>&lt;th>Ação&lt;/th>&lt;/tr>&lt;/thead>&lt;tbody>&lt;tr>&lt;td>1&lt;/td>&lt;td>'Lia'&lt;/td>&lt;td>'Lia'&lt;/td>&lt;td>imprime Lia&lt;/td>&lt;/tr>&lt;tr>&lt;td>2&lt;/td>&lt;td>'Rui'&lt;/td>&lt;td>'Rui'&lt;/td>&lt;td>imprime Rui&lt;/td>&lt;/tr>&lt;tr>&lt;td>fim&lt;/td>&lt;td>nenhum&lt;/td>&lt;td>permanece 'Rui'&lt;/td>&lt;td>segue após o laço&lt;/td>&lt;/tr>&lt;/tbody>&lt;/table>&lt;div class=&quot;caption&quot;>O nome da variável não é o item; ele recebe temporariamente cada item.&lt;/div>&lt;/div>&lt;/div>&lt;h3>Como reconhecer na questão&lt;/h3>&lt;p>Localize a variável entre for e in, identifique o iterável depois de in e marque quais linhas pertencem ao bloco pela indentação.&lt;/p>&lt;ol>&lt;li>escreva os itens do iterável na ordem&lt;/li>&lt;li>atribua o primeiro item à variável do laço&lt;/li>&lt;li>execute somente as linhas indentadas&lt;/li>&lt;li>repita com o próximo item até o iterável acabar&lt;/li>&lt;/ol>&lt;div class=&quot;session-detail-example&quot;>&lt;b>Exemplo guiado&lt;/b>&lt;p>Em nomes=['Lia','Rui'], o código for nome in nomes: print(nome) primeiro usa 'Lia' e depois 'Rui', imprimindo Lia e Rui.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-contrast&quot;>&lt;b>Compare com o erro comum&lt;/b>&lt;p>No teste 'Lia' in nomes, o resultado é True ou False. No laço for nome in nomes, nome recebe cada elemento e o bloco pode agir sobre ele.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-trap&quot;>&lt;b>Pegadinha típica&lt;/b>&lt;p>for não significa automaticamente 'contar números'. Ele pode percorrer strings, listas, tuplas, dicionários e outros iteráveis.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-link&quot;>&lt;b>Conexão útil&lt;/b>&lt;p>Você já usou in para testar pertencimento. Em for, a expressão após in fornece os itens que serão visitados, um por vez.&lt;/p>&lt;/div>&lt;div class=&quot;session-detail-check&quot;>&lt;b>Confira seu raciocínio&lt;/b>&lt;ul>&lt;li>Qual é o iterável?&lt;/li>&lt;li>Qual valor a variável recebe agora?&lt;/li>&lt;li>Quais linhas estão dentro do laço?&lt;/li>&lt;li>O bloco altera alguma variável externa?&lt;/li>&lt;/ul>&lt;/div>&lt;h3>Microchecagem mental&lt;/h3>&lt;p>Em for cor in ('azul','verde'), a variável cor recebe 'azul' e depois 'verde'.&lt;/p>&lt;section class=&quot;support-practice&quot;>&lt;h3>Vamos reconstruir em passos curtos&lt;/h3>&lt;p class=&quot;small&quot;>Estas microperguntas são apoio de aprendizagem e não alteram seu resultado formal.&lt;/p>&lt;div class=&quot;support-practice-item&quot;>&lt;p>&lt;b>Em for cidade in ['Recife','Natal'], qual valor cidade recebe na segunda iteração?&lt;/b>&lt;/p>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;0&quot; data-option-id=&quot;first_item&quot;>A. 'Recife'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;1&quot; data-option-id=&quot;second_item&quot;>B. 'Natal'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-01&quot; data-index=&quot;2&quot; data-option-id=&quot;whole_iterable&quot;>C. ['Recife','Natal']&lt;/button>&lt;/div>&lt;div class=&quot;support-practice-item&quot;>&lt;p>&lt;b>Qual é o valor final de texto?

texto = ''
for letra in 'oi':
    texto = letra + texto&lt;/b>&lt;/p>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-02&quot; data-index=&quot;0&quot; data-option-id=&quot;preserved_order&quot;>A. 'oi'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-02&quot; data-index=&quot;1&quot; data-option-id=&quot;reversed_by_prepend&quot;>B. 'io'&lt;/button>&lt;button type=&quot;button&quot; class=&quot;alt&quot; data-support-practice=&quot;PY-LOOP-SP-C01-02&quot; data-index=&quot;2&quot; data-option-id=&quot;last_item_only&quot;>C. 'o'&lt;/button>&lt;/div>&lt;/section>&lt;/div>&lt;div class=&quot;session-detail-foot&quot;>&lt;button type=&quot;button&quot; class=&quot;primary&quot; data-session-understood=&quot;&quot;>Entendi agora&lt;/button>&lt;button type=&quot;button&quot; data-session-close=&quot;&quot;>Fechar&lt;/button>&lt;/div>&lt;/section>&lt;/div>&lt;/section>&lt;div class=&quot;exercise&quot; data-phase=&quot;idle&quot;>&lt;h3>Fixação imediata 1&lt;/h3>&lt;p style=&quot;white-space:pre-wrap&quot;>Qual é a saída?

for numero in [3, 1, 4]:
    print(numero + 1)&lt;/p>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-LOOP-I01&quot; data-index=&quot;0&quot; data-option-id=&quot;items_without_operation&quot;>A. 3, 1 e 4&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-LOOP-I01&quot; data-index=&quot;1&quot; data-option-id=&quot;each_item_plus_one&quot;>B. 4, 2 e 5&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-LOOP-I01&quot; data-index=&quot;2&quot; data-option-id=&quot;first_item_plus_one_only&quot;>C. 4 apenas&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-LOOP-I01&quot; data-index=&quot;3&quot; data-option-id=&quot;sum_plus_one&quot;>D. 9&lt;/button>&lt;/div>&lt;details style=&quot;margin-top:12px&quot;>&lt;summary>Minha nota sobre este conceito&lt;/summary>&lt;textarea id=&quot;conceptNote&quot;>&lt;/textarea>&lt;/details>&lt;p class=&quot;next-step-hint&quot;>Para continuar, resolva a fixação deste conceito. Se travar, abra “Não entendi”.&lt;/p>&lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;>&lt;button id=&quot;prevConcept&quot; disabled=&quot;&quot;>Anterior&lt;/button>&lt;button id=&quot;nextConcept&quot; class=&quot;primary&quot; disabled=&quot;&quot; aria-disabled=&quot;true&quot; title=&quot;Conclua a fixação imediata antes de avançar.&quot;>Próximo conceito&lt;/button>&lt;/div>&lt;button class=&quot;study-stop ghost&quot;>Pausar e voltar à Trilha&lt;/button>&lt;/div>&lt;/section>

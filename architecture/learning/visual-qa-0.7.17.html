&lt;section id=&quot;studyPanel&quot; class=&quot;card&quot;>&lt;div id=&quot;studyKicker&quot; class=&quot;kicker&quot;>Conceito 2 de 6&lt;/div>&lt;h1 id=&quot;studyTitle&quot;>2. shape e dimensões&lt;/h1>&lt;div id=&quot;studyBody&quot;>&lt;div class=&quot;concept-anchor&quot;>shape descreve o tamanho do array em cada eixo.&lt;/div>&lt;section class=&quot;learning-guide&quot; aria-label=&quot;Explicação em etapas&quot;>&lt;p>shape descreve quantos elementos existem em cada eixo. ndim conta os eixos e size conta todos os elementos. Em uma tabela 2D, shape=(linhas, colunas).&lt;/p>&lt;p>Um array 1D com quatro números tem shape=(4,), ndim=1 e size=4. A vírgula indica uma tupla com um elemento; não há segundo eixo implícito. Um array 2D com duas linhas de dois números tem shape=(2,2), ndim=2 e também size=4.&lt;/p>&lt;pre>&lt;code>import numpy as np
a = np.array([[2, 4], [6, 8], [10, 12]])
a.shape  # (3, 2): três linhas e duas colunas
a.ndim   # 2: dois eixos
a.size   # 6: três vezes dois elementos&lt;/code>&lt;/pre>&lt;h2>Como resolver&lt;/h2>&lt;ol>&lt;li>Conte as linhas e os elementos de cada linha.&lt;/li>&lt;li>Escreva shape na ordem dos eixos.&lt;/li>&lt;li>Multiplique as dimensões para conferir size.&lt;/li>&lt;/ol>&lt;p class=&quot;guide-trap&quot;>&lt;strong>Atenção:&lt;/strong> Arrays com o mesmo size podem ter shapes diferentes; (4,) e (2,2) não representam a mesma estrutura.&lt;/p>&lt;/section>&lt;details class=&quot;info connection concept-disclosure&quot;>&lt;summary>Conexão com o que você já estudou&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>Retoma ordem de matrizes estudada em Álgebra Linear.&lt;/div>&lt;/details>&lt;details class=&quot;info trap concept-disclosure&quot;>&lt;summary>Pegadinha e erro comum&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>Seis elementos podem ter shape (6,), (2,3) ou (3,2). Confundir quantidade total de elementos com shape.&lt;/div>&lt;/details>&lt;section class=&quot;adaptive session-help&quot;>&lt;button id=&quot;adaptiveToggle&quot;>Não entendi / ver explicação completa&lt;/button>&lt;p class=&quot;session-help-note&quot;>Abra quando precisar. Aqui você encontra raciocínio adicional, exemplo e checklist; o uso é registrado como apoio, não como erro.&lt;/p>&lt;/section>&lt;div class=&quot;exercise&quot; data-phase=&quot;idle&quot;>&lt;h3>Fixação imediata 1&lt;/h3>&lt;p style=&quot;white-space:pre-wrap&quot;>Qual é o shape de np.array([[1,2,3],[4,5,6]])?&lt;/p>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;0&quot; data-option-id=&quot;option_1&quot;>A. (6,)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;1&quot; data-option-id=&quot;option_2&quot;>B. (3,2)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;2&quot; data-option-id=&quot;option_3&quot;>C. (2,3)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;3&quot; data-option-id=&quot;option_4&quot;>D. (2,)&lt;/button>&lt;/div>&lt;details style=&quot;margin-top:12px&quot;>&lt;summary>Minha nota sobre este conceito&lt;/summary>&lt;textarea id=&quot;conceptNote&quot;>&lt;/textarea>&lt;/details>&lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;>&lt;button id=&quot;prevConcept&quot;>Anterior&lt;/button>&lt;button id=&quot;nextConcept&quot; class=&quot;primary&quot; disabled=&quot;&quot; aria-disabled=&quot;true&quot; title=&quot;Conclua a fixação imediata antes de avançar.&quot;>Próximo conceito&lt;/button>&lt;/div>&lt;button class=&quot;study-stop ghost&quot;>Pausar e voltar à Trilha&lt;/button>&lt;/div>&lt;/section>

&lt;section id=&quot;studyPanel&quot; class=&quot;card&quot;>&lt;div id=&quot;studyKicker&quot; class=&quot;kicker&quot;>Conceito 2 de 6&lt;/div>&lt;h1 id=&quot;studyTitle&quot;>2. shape e dimensões&lt;/h1>&lt;div id=&quot;studyBody&quot;>&lt;div class=&quot;concept-anchor&quot;>shape descreve o tamanho do array em cada eixo.&lt;/div>&lt;section class=&quot;learning-guide&quot; aria-label=&quot;Explicação em etapas&quot;>&lt;p>shape descreve quantos elementos existem em cada eixo. ndim conta os eixos e size conta todos os elementos. Em uma tabela 2D, shape=(linhas, colunas).&lt;/p>&lt;p>Um array 1D com quatro números tem shape=(4,), ndim=1 e size=4. A vírgula indica uma tupla com um elemento; não há segundo eixo implícito. Um array 2D com duas linhas de dois números tem shape=(2,2), ndim=2 e também size=4.&lt;/p>&lt;pre>&lt;code>import numpy as np
a = np.array([[2, 4], [6, 8], [10, 12]])
a.shape  # (3, 2): três linhas e duas colunas
a.ndim   # 2: dois eixos
a.size   # 6: três vezes dois elementos&lt;/code>&lt;/pre>&lt;h2>Como resolver&lt;/h2>&lt;ol>&lt;li>Conte as linhas e os elementos de cada linha.&lt;/li>&lt;li>Escreva shape na ordem dos eixos.&lt;/li>&lt;li>Multiplique as dimensões para conferir size.&lt;/li>&lt;/ol>&lt;p class=&quot;guide-trap&quot;>&lt;strong>Atenção:&lt;/strong> Arrays com o mesmo size podem ter shapes diferentes; (4,) e (2,2) não representam a mesma estrutura.&lt;/p>&lt;/section>&lt;details class=&quot;info connection concept-disclosure&quot;>&lt;summary>Conexão com o que você já estudou&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>Retoma ordem de matrizes estudada em Álgebra Linear.&lt;/div>&lt;/details>&lt;details class=&quot;info trap concept-disclosure&quot;>&lt;summary>Pegadinha e erro comum&lt;/summary>&lt;div class=&quot;concept-disclosure-body&quot;>Seis elementos podem ter shape (6,), (2,3) ou (3,2). Confundir quantidade total de elementos com shape.&lt;/div>&lt;/details>&lt;section class=&quot;adaptive session-help&quot;>&lt;button id=&quot;adaptiveToggle&quot;>Não entendi / ver explicação completa&lt;/button>&lt;p class=&quot;session-help-note&quot;>Abra quando precisar. Aqui você encontra raciocínio adicional, exemplo e checklist; o uso é registrado como apoio, não como erro.&lt;/p>&lt;/section>&lt;div class=&quot;exercise&quot; data-phase=&quot;idle&quot;>&lt;h3>Fixação imediata 1&lt;/h3>&lt;p style=&quot;white-space:pre-wrap&quot;>Qual é o shape de np.array([[1,2,3],[4,5,6]])?&lt;/p>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;0&quot; data-option-id=&quot;option_1&quot;>A. (6,)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;1&quot; data-option-id=&quot;option_2&quot;>B. (3,2)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;2&quot; data-option-id=&quot;option_3&quot;>C. (2,3)&lt;/button>&lt;button class=&quot;alt&quot; data-immediate=&quot;PY-NP-I02&quot; data-index=&quot;3&quot; data-option-id=&quot;option_4&quot;>D. (2,)&lt;/button>&lt;/div>&lt;details style=&quot;margin-top:12px&quot;>&lt;summary>Minha nota sobre este conceito&lt;/summary>&lt;textarea id=&quot;conceptNote&quot;>&lt;/textarea>&lt;/details>&lt;div class=&quot;row&quot; style=&quot;margin-top:14px&quot;>&lt;button id=&quot;prevConcept&quot;>Anterior&lt;/button>&lt;button id=&quot;nextConcept&quot; class=&quot;primary&quot; disabled=&quot;&quot; aria-disabled=&quot;true&quot; title=&quot;Conclua a fixação imediata antes de avançar.&quot;>Próximo conceito&lt;/button>&lt;/div>&lt;button class=&quot;study-stop ghost&quot;>Pausar e voltar à Trilha&lt;/button>&lt;/div>&lt;/section>

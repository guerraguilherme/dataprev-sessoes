name: Extract EST-PROB-002 Fase 2.5.4 staging

on:
  push:
    branches: [main]
    paths:
      - '.staging-artifacts/EST-PROB-002/fase-2.5.4/runtime.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract isolated staging runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.staging-artifacts/EST-PROB-002/fase-2.5.4/runtime.zip'
          TMP="$(mktemp -d)"
          DEST='staging/EST-PROB-002/fase-2.5.4'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$TMP"
          SRC="$TMP/EST-PROB-002_Golden_Sample_Fase2.5.4/pwa-integration-staging-v0.2.5"
          test -f "$SRC/index.html"
          cp -a "$SRC/." "$DEST/"
          rm -f "$ZIP"
          find "$DEST" -type f -maxdepth 3 -print | sort
      - name: Commit staging-only extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging/EST-PROB-002/fase-2.5.4 .staging-artifacts/EST-PROB-002/fase-2.5.4/runtime.zip
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Stage EST-PROB-002 Fase 2.5.4 mobile QA runtime'
          git push origin main

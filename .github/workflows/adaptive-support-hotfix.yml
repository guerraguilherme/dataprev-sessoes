name: Adaptive support and timer hotfix

on:
  push:
    paths:
      - '.github/workflows/adaptive-support-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve adaptive support and active timer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("const APP_VERSION='0.5.2';", "const APP_VERSION='0.5.3';")

          marker = "  return {intro:'Abra apenas o tipo de ajuda necessário. Isso não conta como erro.',sections:"
          if "if(concept.support)return concept.support;" not in app:
              if marker not in app:
                  raise SystemExit('supportData fallback marker not found')
              app = app.replace(marker, "  if(concept.support)return concept.support;\n" + marker, 1)

          old_timer = "  if(state.timerRunning&&document.visibilityState==='visible')state.activeMs+=Math.max(0,now-(state.lastTick||now));"
          new_timer = "  if(state.timerRunning&&document.visibilityState==='visible'){const delta=Math.max(0,now-(state.lastTick||now));if(delta<=15000)state.activeMs+=delta;}"
          if old_timer in app:
              app = app.replace(old_timer, new_timer, 1)
          elif new_timer not in app:
              raise SystemExit('updateClock marker not found')
          app_path.write_text(app, encoding='utf-8')

          data_path = Path('BD-NORM-002.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))

          support = {
            'BD-NORM-C01': {
              'intro': 'Se a definição X→Y parece abstrata, troque a frase por uma regra verificável: mesmo X não pode apontar para dois Y diferentes.',
              'sections': {
                'symbols': {'title':'Como ler X → Y','html':'<p>Leia a seta como <b>“X determina Y”</b>, não como conta matemática e nem como direção de chave estrangeira.</p><p><b>id_produto → nome_produto</b> significa: sabendo o id_produto, o nome fica determinado.</p><p>A seta é de <b>determinante</b> para <b>determinado</b>.</p>'},
                'intuition': {'title':'Pense em uma pergunta com resposta única','html':'<p>Imagine que eu pergunto: “qual é o nome do produto de id 17?”. Se a regra do banco é correta, só pode existir uma resposta.</p><pre>id 17 → Café\nid 17 → Café   ✓\nid 17 → Arroz  ✗</pre><p>O último caso quebraria a dependência, porque o mesmo X produziria dois Y diferentes.</p>'},
                'calculation': {'title':'Como testar sem fazer cálculo','html':'<ol><li>Escolha o atributo à esquerda da seta.</li><li>Procure linhas com o mesmo valor desse atributo.</li><li>Compare o atributo à direita.</li><li>Se o mesmo X aparecer com Y diferentes, a dependência X→Y não vale.</li></ol><p>Não há multiplicação nem soma: é um <b>teste de determinação</b>.</p>'},
                'connection': {'title':'Ligação com chave e normalização','html':'<p>Você já estudou que uma chave identifica uma linha. Por isso, uma chave normalmente determina os demais atributos daquela entidade.</p><p>A normalização pergunta se algum atributo está sendo determinado pelo lugar errado: só por parte da chave ou por outro atributo não-chave. É daí que surgem 2FN e 3FN.</p>'}
              },
              'check': {'prompt':'Considere: (7, Café), (7, Café), (8, Café), onde o primeiro valor é id_produto e o segundo é nome_produto. Qual afirmação é segura?','options':['id_produto → nome_produto é compatível com os dados; nome_produto → id_produto não é','As duas dependências são obrigatoriamente verdadeiras','nome_produto → id_produto é verdadeira porque Café se repete','Nenhuma dependência pode existir'], 'answer':0, 'explanation':'O id 7 sempre leva a Café. Já o nome Café aparece associado aos ids 7 e 8, então o nome não determina um único id.'}
            },
            'BD-NORM-C02': {
              'intro':'Dependência total fica mais clara quando você tenta retirar uma parte da chave composta e percebe que perde informação necessária.',
              'sections': {
                'symbols': {'title':'O que significam os parênteses','html':'<p><b>(id_pedido, id_produto) → quantidade</b>: o lado esquerdo é um <b>par</b>. Os dois valores juntos formam o determinante.</p><p>Não leia como duas setas separadas.</p>'},
                'intuition': {'title':'Por que preciso dos dois valores?','html':'<p>Se eu disser apenas “pedido 10”, ainda não sei a quantidade: esse pedido pode ter arroz, café e leite em quantidades diferentes.</p><p>Se eu disser apenas “produto café”, também não sei: pedidos diferentes podem comprar quantidades diferentes.</p><p>Quando digo <b>pedido 10 + café</b>, aí a quantidade daquele item fica determinada.</p>'},
                'calculation': {'title':'Teste das partes da chave','html':'<ol><li>Pergunte se id_pedido sozinho determina quantidade. Se não, continue.</li><li>Pergunte se id_produto sozinho determina quantidade. Se não, continue.</li><li>Se somente o par completo determina, a dependência é <b>total</b>.</li></ol>'},
                'connection': {'title':'Ligação com chave composta','html':'<p>Na chave composta, cada componente identifica apenas uma parte do contexto. A 2FN quer que atributos não-chave que pertencem ao item dependam da <b>chave inteira</b>, não de um pedaço dela.</p>'}
              },
              'check': {'prompt':'Em ITENS_PEDIDO, a quantidade muda de produto para produto dentro do mesmo pedido e também de pedido para pedido. O que determina quantidade?','options':['O par (id_pedido,id_produto)','Somente id_pedido','Somente id_produto','Nenhum atributo'], 'answer':0, 'explanation':'É necessário conhecer simultaneamente o pedido e o produto.'}
            },
            'BD-NORM-C03': {
              'intro':'Dependência parcial é o oposto do caso anterior: existe uma chave composta, mas um atributo não-chave consegue ser determinado usando só um pedaço dela.',
              'sections': {
                'symbols': {'title':'Leia “parte da chave” literalmente','html':'<p>Chave: <b>(id_pedido, id_produto)</b>.</p><p>Se aparece <b>id_produto → nome_produto</b>, apenas uma das duas partes da chave já determina nome_produto. Por isso a dependência é <b>parcial</b>.</p>'},
                'intuition': {'title':'O nome do produto não precisa saber o pedido','html':'<p>Para descobrir que o produto 8 se chama “Café”, não importa se ele está no pedido 10, 20 ou 300.</p><p>Logo, guardar nome_produto repetido em cada item do pedido faz o atributo depender apenas de <b>id_produto</b>, uma parte da chave composta.</p>'},
                'calculation': {'title':'Teste rápido para parcial','html':'<ol><li>Existe chave composta? Se não, pare: não há dependência parcial.</li><li>Escolha um atributo não-chave.</li><li>Uma parte própria da chave já consegue determiná-lo?</li><li>Se sim, é dependência parcial e há problema de 2FN.</li></ol>'},
                'connection': {'title':'Diferença para dependência total','html':'<p><b>Total:</b> precisa de toda a chave composta.</p><p><b>Parcial:</b> uma parte da chave já basta.</p><p>Essa comparação é mais importante para a prova do que decorar frases isoladas.</p>'}
              },
              'check': {'prompt':'Chave (id_pedido,id_produto). Para descobrir data_pedido, basta id_pedido. A dependência de data_pedido em relação à chave é:','options':['parcial','total','transitiva','inexistente'], 'answer':0, 'explanation':'id_pedido é apenas uma parte da chave composta e já determina data_pedido.'}
            },
            'BD-NORM-C04': {
              'intro':'A 2FN não é uma nova tabela para decorar; é uma pergunta: algum atributo não-chave depende só de parte de uma chave composta?',
              'sections': {
                'symbols': {'title':'Fórmula mental da 2FN','html':'<p><b>2FN = 1FN + nenhum atributo não-chave dependendo parcialmente de chave candidata composta.</b></p><p>Se a chave for simples, não existe “parte própria” dela.</p>'},
                'intuition': {'title':'Por que separar tabelas','html':'<p>Se nome_produto fica em ITENS_PEDIDO, ele se repete em todos os pedidos que contêm aquele produto.</p><p>Ao mover nome_produto para PRODUTOS, cada nome fica armazenado uma vez, no lugar determinado por id_produto.</p>'},
                'calculation': {'title':'Roteiro de prova','html':'<ol><li>Confirme 1FN.</li><li>Identifique as chaves candidatas.</li><li>Se houver chave composta, examine cada atributo não-chave.</li><li>Se algum depender só de parte da chave, ainda não está em 2FN.</li><li>Separe o atributo junto do determinante correto.</li></ol>'},
                'connection': {'title':'O que muda depois da decomposição','html':'<p>PEDIDOS guarda o que depende de id_pedido. PRODUTOS guarda o que depende de id_produto. ITENS_PEDIDO guarda o que depende do par.</p><p>A decomposição acompanha as dependências que você acabou de identificar.</p>'}
              },
              'check': {'prompt':'Uma relação já está em 1FN e possui chave simples. Ela pode violar 2FN por dependência parcial?','options':['Não','Sim, sempre','Somente se houver FK','Somente se houver NULL'], 'answer':0, 'explanation':'Sem chave composta não existe parte própria da chave da qual um atributo possa depender.'}
            },
            'BD-NORM-C05': {
              'intro':'Na dependência transitiva, o problema não é uma parte da chave: é um atributo não-chave servindo de ponte para outro atributo não-chave.',
              'sections': {
                'symbols': {'title':'Leia a cadeia','html':'<pre>id_funcionario → id_departamento → nome_departamento</pre><p>A chave chega a nome_departamento <b>por intermédio</b> de id_departamento.</p>'},
                'intuition': {'title':'A ponte desnecessária','html':'<p>Sabendo o funcionário, descubro seu departamento. Sabendo o departamento, descubro o nome do departamento.</p><p>Então o nome do departamento não é uma característica diretamente determinada pelo funcionário; ele pertence à entidade DEPARTAMENTO.</p>'},
                'calculation': {'title':'Teste para transitiva','html':'<ol><li>Identifique a chave.</li><li>Veja se a chave determina um atributo não-chave B.</li><li>Veja se B determina outro atributo não-chave C.</li><li>Se sim, C depende transitivamente da chave.</li></ol>'},
                'connection': {'title':'Parcial x transitiva','html':'<p><b>Parcial:</b> parte de uma chave composta → atributo não-chave.</p><p><b>Transitiva:</b> chave → atributo não-chave → outro atributo não-chave.</p><p>Procure primeiro a estrutura da seta; depois dê o nome.</p>'}
              },
              'check': {'prompt':'Chave A; A→B e B→C; B e C são não-chave. A dependência de C em relação a A é:','options':['transitiva','parcial','total por chave composta','referencial'], 'answer':0, 'explanation':'B funciona como atributo não-chave intermediário entre a chave A e C.'}
            },
            'BD-NORM-C06': {
              'intro':'A 3FN entra depois da 2FN e remove a ponte inadequada entre atributos não-chave.',
              'sections': {
                'symbols': {'title':'Fórmula mental útil','html':'<p>Para o nível desta sessão: <b>3FN = 2FN + sem dependência transitiva inadequada entre atributos não-chave.</b></p>'},
                'intuition': {'title':'Cada fato no lugar de sua entidade','html':'<p>nome_departamento descreve o departamento, não o funcionário.</p><p>Por isso ele vai para DEPARTAMENTOS(id_departamento,nome_departamento), enquanto FUNCIONARIOS mantém id_departamento como referência.</p>'},
                'calculation': {'title':'Como corrigir a cadeia','html':'<pre>ANTES\nFUNC(id_func, id_depto, nome_depto)\n\nDEPOIS\nFUNC(id_func, id_depto)\nDEPTO(id_depto, nome_depto)</pre><p>O determinante id_depto e o atributo que ele determina ficam juntos.</p>'},
                'connection': {'title':'Por que isso reduz anomalias','html':'<p>Se o departamento mudar de nome, você altera uma linha em DEPTO, em vez de várias linhas de funcionários. Isso reduz anomalia de atualização.</p>'}
              },
              'check': {'prompt':'Em FUNC(id_func,id_depto,nome_depto), id_depto→nome_depto. Qual atributo deve sair de FUNC para eliminar a dependência transitiva?','options':['nome_depto, indo para uma tabela DEPTO','id_func','a chave primária inteira','nenhum'], 'answer':0, 'explanation':'nome_depto deve ficar junto de seu determinante id_depto em uma relação própria.'}
            },
            'BD-NORM-C07': {
              'intro':'Para a FGV, vale mais um roteiro de classificação do que decorar definições separadas.',
              'sections': {
                'symbols': {'title':'Mapa de decisão','html':'<pre>1. Qual é a chave?\n2. O atributo é não-chave?\n3. Parte da chave composta já determina? → PARCIAL\n4. Outro não-chave determina? → TRANSITIVA\n5. Só a chave completa determina? → TOTAL</pre>'},
                'intuition': {'title':'Três desenhos mentais','html':'<p><b>Total:</b> (A,B) → C</p><p><b>Parcial:</b> A → C, quando a chave é (A,B)</p><p><b>Transitiva:</b> chave → C → D, com C e D não-chave</p>'},
                'calculation': {'title':'Ordem segura de resolução','html':'<ol><li>Circule a chave.</li><li>Marque atributos não-chave.</li><li>Desenhe somente as dependências informadas.</li><li>Procure primeiro parte da chave; depois procure ponte não-chave.</li><li>Só então classifique 2FN ou 3FN.</li></ol>'},
                'connection': {'title':'Como isso vira questão FGV','html':'<p>A banca pode trocar nomes de colunas e aproximar as alternativas. O que permanece é o desenho lógico da dependência. Se você reconstruir as setas, a nomenclatura deixa de ser chute.</p>'}
              },
              'check': {'prompt':'Em R(A,B,C,D), chave (A,B), A→C e C→D. Qual leitura está correta?','options':['C tem dependência parcial; D aparece em cadeia transitiva','C é total; D é parcial','C e D são sempre chaves','Não há violação de normalização'], 'answer':0, 'explanation':'A determina C usando só parte da chave composta; C, sendo não-chave, funciona como ponte até D.'}
            }
          }

          by_id = {c['id']: c for c in data.get('concepts', [])}
          missing = [cid for cid in support if cid not in by_id]
          if missing:
              raise SystemExit('Missing concepts: ' + ', '.join(missing))
          for cid, payload in support.items():
              by_id[cid]['support'] = payload
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("dataprev-sessoes-standalone-v4", "dataprev-sessoes-standalone-v5")
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js BD-NORM-002.json service-worker.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Improve adaptive explanations and active timer"
            git push
          fi

&lt;main id=&quot;main&quot; tabindex=&quot;-1&quot;>&lt;section class=&quot;welcome&quot;>&lt;p class=&quot;eyebrow&quot;>DATAPREV · Perfil 4 · Inteligência da Informação&lt;/p>&lt;h1>Uma questão.&lt;br>&lt;em>Um passo adiante.&lt;/em>&lt;/h1>&lt;p class=&quot;lead&quot;>Responda o que você sabe. Aprenda o que ainda falta. Seus erros viram o próximo passo do estudo.&lt;/p>&lt;/section>&lt;div class=&quot;home-grid&quot;>&lt;section class=&quot;cycle-hero&quot;>&lt;div class=&quot;hero-top&quot;>&lt;p class=&quot;eyebrow&quot;>Seu ponto de partida&lt;/p>&lt;span class=&quot;cycle-index&quot;>Ciclo 01&lt;/span>&lt;/div>&lt;h2>Comece pela primeira questão.&lt;/h2>&lt;p class=&quot;muted&quot;>Você pode responder direto ou abrir a explicação. Não precisa terminar tudo hoje.&lt;/p>&lt;div class=&quot;cycle-numbers&quot;>&lt;div>&lt;strong>70&lt;/strong>&lt;span>questões por ciclo&lt;/span>&lt;/div>&lt;div>&lt;strong>115&lt;/strong>&lt;span>pontos possíveis&lt;/span>&lt;/div>&lt;div>&lt;strong>2&lt;/strong>&lt;span>ciclos distintos&lt;/span>&lt;/div>&lt;/div>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;button class=&quot;button primary&quot; data-action=&quot;start&quot; data-cycle=&quot;ciclo-01&quot;>Começar ciclo 01 &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;>&lt;/path>&lt;/svg>&lt;/button>&lt;p class=&quot;caption&quot; style=&quot;margin-top:14px&quot;>Salvamento automático neste aparelho. Backup disponível em Meu estudo.&lt;/p>&lt;/section>&lt;section class=&quot;side-card&quot;>&lt;div>&lt;span class=&quot;icon-disc&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M12 5v15m0-15C8 2 4 3 2 4v15c4-2 7-1 10 1m0-15c4-3 8-2 10-1v15c-4-2-7-1-10 1&quot;>&lt;/path>&lt;/svg>&lt;/span>&lt;p class=&quot;eyebrow&quot;>Seu caderno de aprendizagem&lt;/p>&lt;h3>Seu estudo começa a ganhar memória.&lt;/h3>&lt;p>Notas, dúvidas e erros ficam ligados à questão. Você poderá refazer sem ver o gabarito e acompanhar as revisões.&lt;/p>&lt;/div>&lt;button class=&quot;text-link&quot; data-action=&quot;notebook&quot;>Conhecer o caderno &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;>&lt;/path>&lt;/svg>&lt;/button>&lt;/section>&lt;/div>&lt;div class=&quot;home-bottom&quot;>&lt;section class=&quot;step-card&quot;>&lt;span class=&quot;step-number&quot;>01 / RESOLVA&lt;/span>&lt;h3>Teste o que já sabe.&lt;/h3>&lt;p>Leia a questão, escolha a alternativa e indique sua confiança.&lt;/p>&lt;/section>&lt;section class=&quot;step-card&quot;>&lt;span class=&quot;step-number&quot;>02 / APRENDA&lt;/span>&lt;h3>A explicação está aqui.&lt;/h3>&lt;p>Abra o essencial, veja outro exemplo resolvido e aprofunde quando precisar.&lt;/p>&lt;/section>&lt;section class=&quot;step-card&quot;>&lt;span class=&quot;step-number&quot;>03 / CONSOLIDE&lt;/span>&lt;h3>Volte com outro olhar.&lt;/h3>&lt;p>Registre seu erro e aplique o conceito em uma questão nova no próximo ciclo.&lt;/p>&lt;/section>&lt;/div>&lt;div class=&quot;section-top&quot;>&lt;div>&lt;p class=&quot;eyebrow&quot;>Seu percurso&lt;/p>&lt;h2>Dois ciclos, novos problemas.&lt;/h2>&lt;/div>&lt;/div>&lt;div class=&quot;cycle-list&quot;>&lt;article class=&quot;cycle-row&quot;>&lt;span class=&quot;cycle-status&quot;>Disponível&lt;/span>&lt;h3>Ciclo 01 · Diagnosticar e aprender&lt;/h3>&lt;p>70 questões autorais · 40 gerais + 30 específicas&lt;/p>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;div class=&quot;actions&quot; style=&quot;margin-top:18px&quot;>&lt;button class=&quot;button secondary&quot; data-action=&quot;start&quot; data-cycle=&quot;ciclo-01&quot;>Começar&lt;/button>&lt;/div>&lt;/article>&lt;article class=&quot;cycle-row&quot;>&lt;span class=&quot;cycle-status&quot;>Após o ciclo 01&lt;/span>&lt;h3>Ciclo 02 · Aplicar em novos problemas&lt;/h3>&lt;p>70 questões autorais · 40 gerais + 30 específicas&lt;/p>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;div class=&quot;actions&quot; style=&quot;margin-top:18px&quot;>&lt;button class=&quot;button secondary&quot; data-action=&quot;start&quot; data-cycle=&quot;ciclo-02&quot; disabled=&quot;&quot;>Começar&lt;/button>&lt;/div>&lt;/article>&lt;/div>&lt;p class=&quot;future-note&quot;>Questões autorais, não reproduções oficiais. Estilo inspirado nos materiais FGV fornecidos; dificuldade editorial, sem calibração psicométrica. Dois ciclos de treino representativos. Não cobrem integralmente o edital. Revisão de pontos fracos não substitui os temas ainda não amostrados. Nenhuma nota deste treino é uma previsão de classificação.&lt;/p>&lt;/main>

&lt;main id=&quot;main&quot; tabindex=&quot;-1&quot;>&lt;div class=&quot;study-top&quot;>&lt;div class=&quot;breadcrumb&quot;>&lt;button data-action=&quot;home&quot;>Ciclos&lt;/button>&lt;span>/&lt;/span>&lt;span>Ciclo 01&lt;/span>&lt;/div>&lt;div class=&quot;study-progress&quot;>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;/div>&lt;/div>&lt;div class=&quot;study-layout&quot;>&lt;div class=&quot;study-main&quot;>&lt;article class=&quot;question-card&quot; data-corrected=&quot;false&quot;>&lt;div class=&quot;question-meta&quot;>&lt;span class=&quot;topic-tag&quot;>Português&lt;/span>&lt;span class=&quot;question-count&quot;>QUESTÃO 01 / 70 · 1 ponto&lt;/span>&lt;/div>&lt;p class=&quot;question-topic&quot;>Inferência e representatividade · Autoral, estilo FGV&lt;/p>&lt;div class=&quot;passage&quot;>Uma prefeitura adotou um sistema para ordenar pedidos de manutenção. O tempo médio de atendimento caiu, mas bairros com poucos registros continuaram recebendo menos visitas. A administração atribuiu o resultado à baixa demanda. Uma auditoria observou, porém, que o próprio registro dependia de acesso estável à internet. A ausência de pedidos, portanto, não era evidência suficiente de ausência de necessidade. O sistema acelerava a decisão; não resolvia, por si só, o problema de quais necessidades chegavam a ser registradas.&lt;/div>&lt;h1 class=&quot;question-title&quot; id=&quot;question-title&quot; tabindex=&quot;-1&quot;>A conclusão mais bem sustentada pelo texto é que a avaliação do sistema deve&lt;/h1>&lt;details class=&quot;learning&quot; id=&quot;learning&quot;>&lt;summary class=&quot;help-summary&quot;>&lt;span class=&quot;help-label&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M12 5v15m0-15C8 2 4 3 2 4v15c4-2 7-1 10 1m0-15c4-3 8-2 10-1v15c-4-2-7-1-10 1&quot;>&lt;/path>&lt;/svg> Preciso aprender este tema&lt;/span>&lt;span class=&quot;chevron&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;m6 9 6 6 6-6&quot;>&lt;/path>&lt;/svg>&lt;/span>&lt;/summary>&lt;div class=&quot;learning-body&quot;>&lt;p class=&quot;eyebrow&quot;>O essencial · Inferência e limite do texto&lt;/p>&lt;p class=&quot;essence&quot;>Inferir é concluir a partir de pistas; extrapolar é acrescentar uma certeza que o texto não sustenta.&lt;/p>&lt;p>Comece separando fato narrado, interpretação do autor e conclusão proposta pela alternativa. Uma inferência correta pode usar outras palavras, mas precisa manter o alcance da afirmação.&lt;/p>&lt;p>Desconfie de trocas discretas: “não é suficiente” não significa “é inútil”; “pode ocorrer” não significa “sempre ocorre”. Uma alternativa pode citar palavras do texto e mudar a relação entre elas.&lt;/p>&lt;details open=&quot;&quot;>&lt;summary>Outro exemplo, resolvido passo a passo&lt;/summary>&lt;div class=&quot;worked&quot;>Se um relatório diz “a média melhorou, mas a desigualdade permaneceu”, conclui-se que a melhora da média não eliminou a desigualdade. Não se conclui que ninguém melhorou.&lt;/div>&lt;/details>&lt;details>&lt;summary>Como chegar à resposta&lt;/summary>&lt;ol>&lt;li>Localize a afirmação que sustenta a resposta.&lt;/li>&lt;li>Verifique se a alternativa ampliou causa, alcance ou certeza.&lt;/li>&lt;li>Elimine a conclusão que exige uma premissa ausente.&lt;/li>&lt;/ol>&lt;p class=&quot;trap&quot;>&lt;strong>Onde é fácil se confundir:&lt;/strong> Repetição de vocabulário não garante preservação do sentido.&lt;/p>&lt;/details>&lt;p class=&quot;caption&quot; style=&quot;margin-top:20px&quot;>Edital — Português, itens 1 e 6&lt;/p>&lt;button class=&quot;text-link&quot; data-action=&quot;back-question&quot;>Voltar à questão &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;>&lt;/path>&lt;/svg>&lt;/button>&lt;/div>&lt;/details>&lt;div class=&quot;options&quot; role=&quot;radiogroup&quot; aria-label=&quot;Alternativas&quot;>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O1&quot;>&lt;span class=&quot;option-letter&quot;>A&lt;/span>&lt;span class=&quot;option-text&quot;>substituir os pedidos registrados pela mesma quantidade de visitas em todos os bairros.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O4&quot;>&lt;span class=&quot;option-letter&quot;>B&lt;/span>&lt;span class=&quot;option-text&quot;>concluir que a ordenação automatizada tornou o atendimento menos rápido.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O2&quot;>&lt;span class=&quot;option-letter&quot;>C&lt;/span>&lt;span class=&quot;option-text&quot;>tomar a baixa quantidade de pedidos como indicador suficiente de eficiência.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;s &lt;main id=&quot;main&quot; tabindex=&quot;-1&quot;>&lt;div class=&quot;study-top&quot;>&lt;div class=&quot;breadcrumb&quot;>&lt;button data-action=&quot;home&quot;>Ciclos&lt;/button>&lt;span>/&lt;/span>&lt;span>Ciclo 01&lt;/span>&lt;/div>&lt;div class=&quot;study-progress&quot;>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;/div>&lt;/div>&lt;div class=&quot;study-layout&quot;>&lt;div class=&quot;study-main&quot;>&lt;article class=&quot;question-card&quot; data-corrected=&quot;false&quot;>&lt;div class=&quot;question-meta&quot;>&lt;span class=&quot;topic-tag&quot;>Português&lt;/span>&lt;span class=&quot;question-count&quot;>QUESTÃO 01 / 70 · 1 ponto&lt;/span>&lt;/div>&lt;p class=&quot;question-topic&quot;>Inferência e representatividade · Autoral, estilo FGV&lt;/p>&lt;div class=&quot;passage&quot;>Uma prefeitura adotou um sistema para ordenar pedidos de manutenção. O tempo médio de atendimento caiu, mas bairros com poucos registros continuaram recebendo menos visitas. A administração atribuiu o resultado à baixa demanda. Uma auditoria observou, porém, que o próprio registro dependia de acesso estável à internet. A ausência de pedidos, portanto, não era evidência suficiente de ausência de necessidade. O sistema acelerava a decisão; não resolvia, por si só, o problema de quais necessidades chegavam a ser registradas.&lt;/div>&lt;h1 class=&quot;question-title&quot; id=&quot;question-title&quot; tabindex=&quot;-1&quot;>A conclusão mais bem sustentada pelo texto é que a avaliação do sistema deve&lt;/h1>&lt;details class=&quot;learning&quot; id=&quot;learning&quot; open=&quot;&quot;>&lt;summary class=&quot;help-summary&quot;>&lt;span class=&quot;help-label&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M12 5v15m0-15C8 2 4 3 2 4v15c4-2 7-1 10 1m0-15c4-3 8-2 10-1v15c-4-2-7-1-10 1&quot;>&lt;/path>&lt;/svg> Preciso aprender este tema&lt;/span>&lt;span class=&quot;chevron&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;m6 9 6 6 6-6&quot;>&lt;/path>&lt;/svg>&lt;/span>&lt;/summary>&lt;div class=&quot;learning-body&quot;>&lt;p class=&quot;eyebrow&quot;>O essencial · Inferência e limite do texto&lt;/p>&lt;p class=&quot;essence&quot;>Inferir é concluir a partir de pistas; extrapolar é acrescentar uma certeza que o texto não sustenta.&lt;/p>&lt;p>Comece separando fato narrado, interpretação do autor e conclusão proposta pela alternativa. Uma inferência correta pode usar outras palavras, mas precisa manter o alcance da afirmação.&lt;/p>&lt;p>Desconfie de trocas discretas: “não é suficiente” não significa “é inútil”; “pode ocorrer” não significa “sempre ocorre”. Uma alternativa pode citar palavras do texto e mudar a relação entre elas.&lt;/p>&lt;details open=&quot;&quot;>&lt;summary>Outro exemplo, resolvido passo a passo&lt;/summary>&lt;div class=&quot;worked&quot;>Se um relatório diz “a média melhorou, mas a desigualdade permaneceu”, conclui-se que a melhora da média não eliminou a desigualdade. Não se conclui que ninguém melhorou.&lt;/div>&lt;/details>&lt;details>&lt;summary>Como chegar à resposta&lt;/summary>&lt;ol>&lt;li>Localize a afirmação que sustenta a resposta.&lt;/li>&lt;li>Verifique se a alternativa ampliou causa, alcance ou certeza.&lt;/li>&lt;li>Elimine a conclusão que exige uma premissa ausente.&lt;/li>&lt;/ol>&lt;p class=&quot;trap&quot;>&lt;strong>Onde é fácil se confundir:&lt;/strong> Repetição de vocabulário não garante preservação do sentido.&lt;/p>&lt;/details>&lt;p class=&quot;caption&quot; style=&quot;margin-top:20px&quot;>Edital — Português, itens 1 e 6&lt;/p>&lt;button class=&quot;text-link&quot; data-action=&quot;back-question&quot;>Voltar à questão &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;>&lt;/path>&lt;/svg>&lt;/button>&lt;/div>&lt;/details>&lt;div class=&quot;options&quot; role=&quot;radiogroup&quot; aria-label=&quot;Alternativas&quot;>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O1&quot;>&lt;span class=&quot;option-letter&quot;>A&lt;/span>&lt;span class=&quot;option-text&quot;>substituir os pedidos registrados pela mesma quantidade de visitas em todos os bairros.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O4&quot;>&lt;span class=&quot;option-letter&quot;>B&lt;/span>&lt;span class=&quot;option-text&quot;>concluir que a ordenação automatizada tornou o atendimento menos rápido.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O2&quot;>&lt;span class=&quot;option-letter&quot;>C&lt;/span>&lt;span class=&quot;option-text&quot;>tomar a baixa quantidade de pedidos como indicador suficiente de eficiência.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O0&quot;>&lt;span class=&quot;option-letter&quot;>D&lt;/span>&lt;span class=&quot;option-text&quot;>considerar tanto a rapidez das decisões quanto as condições de produção dos dados utilizados.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O3&quot;>&lt;span class=&quot;option-letter&quot;>E&lt;/span>&lt;span class=&quot;option-text&quot;>atribuir a redução do tempo de atendimento à melhora do acesso à internet.&lt;/span>&lt;/button>&lt;/div>&lt;fieldset class=&quot;confidence&quot;>&lt;legend>Qual é sua confiança nesta resposta?&lt;/legend>&lt;div class=&quot;confidence-options&quot;>&lt;label>&lt;input type=&quot;radio&quot; name=&quot;confidence&quot; value=&quot;baixa&quot;>&lt;span>Baixa&lt;/span>&lt;/label>&lt;label>&lt;input type=&quot;radio&quot; name=&quot;confidence&quot; value=&quot;media&quot;>&lt;span>Média&lt;/span>&lt;/label>&lt;label>&lt;input type=&quot;radio&quot; name=&quot;confidence&quot; value=&quot;alta&quot;>&lt;span>Alta&lt;/span>&lt;/label>&lt;/div>&lt;/fieldset>&lt;details class=&quot;note-box&quot; style=&quot;border:0;margin:0 0 12px;padding:0&quot;>&lt;summary>Meu raciocínio antes de conferir · opcional&lt;/summary>&lt;label class=&quot;sr-only&quot; for=&quot;reason&quot;>Meu raciocínio&lt;/label>&lt;textarea id=&quot;reason&quot; data-field=&quot;reason&quot; maxlength=&quot;10000&quot; placeholder=&quot;Uma frase já ajuda: qual foi a regra ou o cálculo que usei?&quot;>&lt;/textarea>&lt;/details>&lt;div class=&quot;study-actions&quot;>&lt;button class=&quot;button primary&quot; data-action=&quot;grade&quot; disabled=&quot;&quot;>Conferir resposta &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round& th d=&quot;M19 12H5m6-6-6 6 6 6&quot;>&lt;/path>&lt;/svg> Anterior&lt;/button>&lt;p>Seu ponto de parada fica salvo.&lt;/p>&lt;button class=&quot;button quiet&quot; data-action=&quot;report&quot; data-cycle=&quot;ciclo-01&quot;>Visão do ciclo&lt;/button>&lt;/div>&lt;/div>&lt;aside class=&quot;study-rail&quot; aria-label=&quot;Navegação do ciclo&quot;>&lt;section class=&quot;rail-section rail-timer&quot;>&lt;h3>No seu ritmo&lt;/h3>&lt;div class=&quot;timer-row&quot;>&lt;span>Tempo ativo&lt;/span>&lt;strong id=&quot;timer&quot;>0:00&lt;/strong>&lt;/div>&lt;button class=&quot;text-link&quot; data-action=&quot;pause&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M8 5v14M16 5v14&quot;>&lt;/path>&lt;/svg> Pausar contagem&lt;/button>&lt;p class=&quot;caption&quot;>A contagem para quando esta aba fica oculta.&lt;/p>&lt;/section>&lt;details class=&quot;rail-section question-map&quot;>&lt;summary>Mapa das 70 questões&lt;/summary>&lt;div class=&quot;map-grid&quot;>&lt;button data-action=&quot;jump&quot; data-cycle=&quot;ciclo-01&quot; data-index=&quot;0&quot; class=&quot;current &quot; aria-label=&quot;Questão 1, Português, pendente&quot; aria-current=&quot;step&quot;>01&lt;/button>&lt;button data-action=&quot;jump&quot; data-cycle=&quot;ciclo-01&quot; data-index=&quot;1&quot; class=&quot;&quot; aria-label=&quot;Questão 2, Português, pendente&quot;>02&lt;/button>&lt;button data-action=&quot;jump&quot; data-cycle=&quot;ciclo-01&quot; data-index=&quot;2&quot; class=&quot;&quot; aria-label=&quot;Questão 3, Português, pendente&quot;>03&lt;/button>&lt;button data-action=&quot;jump&quot; data-cycle=&quot;ciclo-01&quot; data-index=&quot;3&quot; class=&quot;&quot; aria-label=&quot;Questão 4, Português, pendente&quot;>04&lt;/button>&lt;button data-action=&quot;jump&quot; data-cycle=&quot;ciclo-01& &lt;main id=&quot;main&quot; tabindex=&quot;-1&quot;>&lt;div class=&quot;study-top&quot;>&lt;div class=&quot;breadcrumb&quot;>&lt;button data-action=&quot;home&quot;>Ciclos&lt;/button>&lt;span>/&lt;/span>&lt;span>Ciclo 01&lt;/span>&lt;/div>&lt;div class=&quot;study-progress&quot;>&lt;div class=&quot;progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Questões respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;70&quot; aria-valuenow=&quot;0&quot;>&lt;span style=&quot;width:0%&quot;>&lt;/span>&lt;/div>&lt;div class=&quot;progress-caption&quot;>&lt;span>0 de 70 respondidas&lt;/span>&lt;span>70 restantes&lt;/span>&lt;/div>&lt;/div>&lt;/div>&lt;div class=&quot;study-layout&quot;>&lt;div class=&quot;study-main&quot;>&lt;article class=&quot;question-card&quot; data-corrected=&quot;false&quot;>&lt;div class=&quot;question-meta&quot;>&lt;span class=&quot;topic-tag&quot;>Português&lt;/span>&lt;span class=&quot;question-count&quot;>QUESTÃO 01 / 70 · 1 ponto&lt;/span>&lt;/div>&lt;p class=&quot;question-topic&quot;>Inferência e representatividade · Autoral, estilo FGV&lt;/p>&lt;div class=&quot;passage&quot;>Uma prefeitura adotou um sistema para ordenar pedidos de manutenção. O tempo médio de atendimento caiu, mas bairros com poucos registros continuaram recebendo menos visitas. A administração atribuiu o resultado à baixa demanda. Uma auditoria observou, porém, que o próprio registro dependia de acesso estável à internet. A ausência de pedidos, portanto, não era evidência suficiente de ausência de necessidade. O sistema acelerava a decisão; não resolvia, por si só, o problema de quais necessidades chegavam a ser registradas.&lt;/div>&lt;h1 class=&quot;question-title&quot; id=&quot;question-title&quot; tabindex=&quot;-1&quot;>A conclusão mais bem sustentada pelo texto é que a avaliação do sistema deve&lt;/h1>&lt;details class=&quot;learning&quot; id=&quot;learning&quot; open=&quot;&quot;>&lt;summary class=&quot;help-summary&quot;>&lt;span class=&quot;help-label&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M12 5v15m0-15C8 2 4 3 2 4v15c4-2 7-1 10 1m0-15c4-3 8-2 10-1v15c-4-2-7-1-10 1&quot;>&lt;/path>&lt;/svg> Preciso aprender este tema&lt;/span>&lt;span class=&quot;chevron&quot;>&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;m6 9 6 6 6-6&quot;>&lt;/path>&lt;/svg>&lt;/span>&lt;/summary>&lt;div class=&quot;learning-body&quot;>&lt;p class=&quot;eyebrow&quot;>O essencial · Inferência e limite do texto&lt;/p>&lt;p class=&quot;essence&quot;>Inferir é concluir a partir de pistas; extrapolar é acrescentar uma certeza que o texto não sustenta.&lt;/p>&lt;p>Comece separando fato narrado, interpretação do autor e conclusão proposta pela alternativa. Uma inferência correta pode usar outras palavras, mas precisa manter o alcance da afirmação.&lt;/p>&lt;p>Desconfie de trocas discretas: “não é suficiente” não significa “é inútil”; “pode ocorrer” não significa “sempre ocorre”. Uma alternativa pode citar palavras do texto e mudar a relação entre elas.&lt;/p>&lt;details open=&quot;&quot;>&lt;summary>Outro exemplo, resolvido passo a passo&lt;/summary>&lt;div class=&quot;worked&quot;>Se um relatório diz “a média melhorou, mas a desigualdade permaneceu”, conclui-se que a melhora da média não eliminou a desigualdade. Não se conclui que ninguém melhorou.&lt;/div>&lt;/details>&lt;details>&lt;summary>Como chegar à resposta&lt;/summary>&lt;ol>&lt;li>Localize a afirmação que sustenta a resposta.&lt;/li>&lt;li>Verifique se a alternativa ampliou causa, alcance ou certeza.&lt;/li>&lt;li>Elimine a conclusão que exige uma premissa ausente.&lt;/li>&lt;/ol>&lt;p class=&quot;trap&quot;>&lt;strong>Onde é fácil se confundir:&lt;/strong> Repetição de vocabulário não garante preservação do sentido.&lt;/p>&lt;/details>&lt;p class=&quot;caption&quot; style=&quot;margin-top:20px&quot;>Edital — Português, itens 1 e 6&lt;/p>&lt;button class=&quot;text-link&quot; data-action=&quot;back-question&quot;>Voltar à questão &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;>&lt;path d=&quot;M5 12h14m-6-6 6 6-6 6&quot;>&lt;/path>&lt;/svg>&lt;/button>&lt;/div>&lt;/details>&lt;div class=&quot;options&quot; role=&quot;radiogroup&quot; aria-label=&quot;Alternativas&quot;>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O1&quot;>&lt;span class=&quot;option-letter&quot;>A&lt;/span>&lt;span class=&quot;option-text&quot;>substituir os pedidos registrados pela mesma quantidade de visitas em todos os bairros.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O4&quot;>&lt;span class=&quot;option-letter&quot;>B&lt;/span>&lt;span class=&quot;option-text&quot;>concluir que a ordenação automatizada tornou o atendimento menos rápido.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; data-action=&quot;select&quot; data-option=&quot;CICLO-01-Q001-O2&quot;>&lt;span class=&quot;option-letter&quot;>C&lt;/span>&lt;span class=&quot;option-text&quot;>tomar a baixa quantidade de pedidos como indicador suficiente de eficiência.&lt;/span>&lt;/button>&lt;button type=&quot;button&quot; role=&quot;radio&quot; class=&quot;option&quot; aria-checked=&quot;false&quot; d
